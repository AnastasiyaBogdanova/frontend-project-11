<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSS Reader</title>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-800 antialiased">
    <div class="container mx-auto max-w-3xl px-4 py-10">
      <header class="mb-8">
        <h1 class="text-3xl font-bold tracking-tight text-slate-900">
          RSS Reader
        </h1>
        <p class="mt-2 text-slate-500">
          Агрегатор RSS-потоков: добавьте ссылку на ленту и читайте новости в одном месте.
        </p>
      </header>

      <main>
        <form id="rss-form" class="flex flex-col gap-3 sm:flex-row" novalidate>
          <label for="rss-url" class="sr-only">URL RSS-потока</label>
          <input
            id="rss-url"
            name="url"
            type="url"
            inputmode="url"
            autocomplete="url"
            required
            placeholder="https://example.com/rss.xml"
            class="block w-full rounded-md border-slate-300 shadow-sm focus:border-sky-500 focus:ring-sky-500 sm:text-sm"
          />
          <button
            type="submit"
            class="inline-flex justify-center rounded-md bg-sky-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-sky-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500 focus-visible:ring-offset-2"
          >
            Добавить
          </button>
        </form>

        <section id="feeds" class="mt-10 hidden">
          <h2 class="text-xl font-semibold text-slate-900">Потоки</h2>
          <ul id="feeds-list" class="mt-3 space-y-2"></ul>
        </section>

        <section id="posts" class="mt-10 hidden">
          <h2 class="text-xl font-semibold text-slate-900">Посты</h2>
          <ul id="posts-list" class="mt-3 space-y-2"></ul>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
