<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSS Reader</title>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-800 antialiased">
    <div class="container mx-auto max-w-3xl px-4 py-10">
      <header class="mb-8">
        <h1 data-i18n="app.title" class="text-3xl font-bold tracking-tight text-slate-900"></h1>
        <p data-i18n="app.subtitle" class="mt-2 text-slate-500"></p>
      </header>

      <main>
        <form id="rss-form" class="space-y-1" novalidate>
          <div class="flex flex-col gap-3 sm:flex-row sm:items-end">
            <div class="flex-1">
              <label
                for="rss-url"
                data-i18n="form.label"
                class="mb-1 block text-sm font-medium text-slate-700"
              ></label>
              <input
                id="rss-url"
                name="url"
                type="text"
                inputmode="url"
                autocomplete="url"
                data-i18n-placeholder="form.placeholder"
                class="block w-full rounded-md border-slate-300 shadow-sm focus:border-sky-500 focus:ring-sky-500 sm:text-sm"
              />
            </div>
            <button
              type="submit"
              data-i18n="form.submit"
              class="inline-flex h-9 shrink-0 items-center justify-center rounded-md bg-sky-600 px-4 text-sm font-semibold text-white shadow-sm hover:bg-sky-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
            ></button>
          </div>
          <p id="rss-feedback" class="h-5 text-sm"></p>
        </form>

        <section id="feeds" class="mt-10 hidden">
          <h2 data-i18n="sections.feeds" class="text-xl font-semibold text-slate-900"></h2>
          <ul id="feeds-list" class="mt-3 space-y-2"></ul>
        </section>

        <section id="posts" class="mt-10 hidden">
          <h2 data-i18n="sections.posts" class="text-xl font-semibold text-slate-900"></h2>
          <ul id="posts-list" class="mt-3 space-y-2"></ul>
        </section>
      </main>
    </div>

    <dialog
      id="post-modal"
      class="w-full max-w-lg rounded-lg border border-slate-200 bg-white p-0 shadow-xl backdrop:bg-slate-900/40"
    >
      <div data-test="modal-body" class="space-y-3 p-6">
        <h3 id="modal-title" class="text-lg font-semibold text-slate-900"></h3>
        <p id="modal-description" class="text-sm text-slate-600"></p>
        <div class="flex items-center justify-between gap-3 pt-2">
          <a
            id="modal-link"
            data-i18n="modal.readMore"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="text-sm font-medium text-sky-600 hover:underline"
          ></a>
          <button
            id="modal-close"
            data-i18n="modal.close"
            type="button"
            class="rounded-md border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50"
          ></button>
        </div>
      </div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
